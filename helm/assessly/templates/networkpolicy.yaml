{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "assessly.fullname" . }}
  labels:
    {{- include "assessly.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "assessly.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingress controller and the in-cluster Prometheus (metrics scrape) are
    # the only expected callers; everything else on the pod network is denied.
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS resolution via kube-dns/coredns.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS egress to Convex/Clerk/Stream (hosted, non-cluster endpoints, so
    # a CIDR-scoped egress rule isn't workable — scoped to port 443 only).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
{{- end }}
