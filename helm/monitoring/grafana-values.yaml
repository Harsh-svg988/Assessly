adminPassword: admin

persistence:
  enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: assessly
        orgId: 1
        folder: Assessly
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/assessly

dashboardsConfigMaps:
  assessly: assessly-dashboard

service:
  type: ClusterIP
